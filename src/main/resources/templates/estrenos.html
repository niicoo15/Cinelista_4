<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estrenos - CineLista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #lista-estrenos {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .tarjeta-estreno {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1.25rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tarjeta-estreno h3 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .tarjeta-estreno p {
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }

        .btn-interes {
            margin-top: 0.75rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.875rem;
            border-radius: 0.375rem;
            border: 1px solid #0d6efd;
            background-color: #ffffff;
            color: #0d6efd;
            cursor: pointer;
            align-self: flex-start;
        }

        .btn-interes:hover {
            background-color: #0d6efd;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-normal mb-0">Estrenos</h1>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <ul id="lista-estrenos"></ul>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" th:src="@{/js/componentes/TarjetaEstreno.js}"></script>
<script type="text/babel" th:src="@{/js/estrenos.js}"></script>
</body>
</html>
